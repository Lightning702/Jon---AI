<!doctype html>
<html lang="de">
  <head>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

  </head>
  <body>
    <div id="root"></div>
    <div id="startfehler" hidden>
      <div class="karte">
        <h1><span id="startfehler-kreis" hidden></span><span id="startfehler-titel">Jon startet nicht</span></h1>
        <p id="startfehler-text"></p>
        <pre id="startfehler-detail" hidden></pre>
        <button onclick="location.reload()">Seite neu laden</button>
      </div>
    </div>
    <style>
      #startfehler {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #050506;
        color: rgba(255, 255, 255, 0.8);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        z-index: 9999;
      }
      #startfehler[hidden],
      #startfehler [hidden] {
        display: none;
      }
      #startfehler-kreis {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 8px;
        border: 2px solid rgba(252, 211, 77, 0.25);
        border-top-color: #fcd34d;
        border-radius: 50%;
        vertical-align: -1px;
        animation: startfehler-drehen 0.9s linear infinite;
      }
      @keyframes startfehler-drehen {
        to {
          transform: rotate(360deg);
        }
      }
      #startfehler .karte {
        width: 100%;
        max-width: 420px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        padding: 20px;
      }
      #startfehler h1 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 500;
        color: #fcd34d;
      }
      #startfehler p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.6);
      }
      #startfehler pre {
        margin: 12px 0 0;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.4);
        padding: 12px;
        font-size: 11px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.5);
      }
      #startfehler button {
        margin-top: 16px;
        width: 100%;
        border: 1px solid rgba(251, 191, 36, 0.4);
        border-radius: 12px;
        background: rgba(251, 191, 36, 0.1);
        padding: 9px 12px;
        font-size: 12.5px;
        color: #fde68a;
        cursor: pointer;
      }
    </style>
    <script>
      (function () {
        var erster = "";
        var wurzel = document.getElementById("root");
        var schirm = document.getElementById("startfehler");
        function bereit() {
          return !!wurzel && wurzel.childElementCount > 0;
        }
        function zeigen(titel, grund, wartet) {
          if (!schirm || bereit()) return;
          document.getElementById("startfehler-titel").textContent = titel;
          document.getElementById("startfehler-text").textContent = grund;
          document.getElementById("startfehler-kreis").hidden = !wartet;
          var detail = document.getElementById("startfehler-detail");
          detail.textContent = erster;
          detail.hidden = !erster;
          schirm.hidden = false;
        }
        function merken(text) {
          if (!erster && text) erster = String(text);
        }
        if (wurzel && window.MutationObserver) {
          var beobachter = new MutationObserver(function () {
            if (bereit() && schirm) {
              schirm.hidden = true;
              beobachter.disconnect();
            }
          });
          beobachter.observe(wurzel, { childList: true });
        }
        window.addEventListener("error", function (e) {
          merken((e && e.message) || "");
          setTimeout(function () {
            zeigen(
              "Jon startet nicht",
              "Die Oberfläche ist beim Start abgebrochen. Meist fehlt dem Browser ein Recht, das es nur über localhost oder https gibt.",
              false
            );
          }, 400);
        });
        window.addEventListener("unhandledrejection", function (e) {
          merken((e && e.reason && (e.reason.message || e.reason)) || "");
        });
        setTimeout(function () {
          zeigen(
            "Jon startet …",
            "Jon bereitet die Oberfläche vor. Nach einem Update kann das beim ersten Start etwas dauern – das Fenster öffnet sich von selbst.",
            true
          );
        }, 12000);
        setTimeout(function () {
          zeigen(
            "Jon startet nicht",
            "Die Oberfläche lädt nicht. Prüfe, ob das Backend erreichbar ist und ob der Geräte-Schlüssel in der Adresse steht (…/app/?token=…).",
            false
          );
        }, 120000);
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="funke"></canvas><script src="funke.js"></script><script>const funke=window.Funke&&Funke.create(document.getElementById('funke'),{state:'idle'});let vorher='idle';window.setMiniJonState=state=>{if(!funke)return;const neu=state==='working'?'working':'idle';if(vorher==='working'&&neu==='idle'){funke.setState('happy');setTimeout(()=>funke.setState('idle'),1800);}else funke.setState(neu);vorher=neu;};if(funke){funke.start();document.addEventListener('visibilitychange',()=>document.hidden?funke.stop():funke.start());}</script></body></html>
